# This workflow is triggered two ways:
#
# 1. When a tag is created, the workflow will upload the package to
#    test.pypi.org.
# 2. When a release is made, the workflow will upload the package to pypi.org.
#
# It is done this way until PyPI has draft reviews, to allow for a two-stage
# upload with a chance for manual intervention before the final publication.
#
# Uploads use trusted publishing, so there are no API tokens: on both PyPI and
# TestPyPI, audio-feeder trusts this workflow (publish.yml), when it runs in
# the "release" environment of pganssle/audio-feeder. Only the publish job
# runs in that environment, and only it can get an upload token.
name: Upload package

on:
  release:
    types: [created]
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # Caching is deliberately left off here, so that a release build never
    # restores anything written by a pull request build.
    - uses: astral-sh/setup-uv@v10.3.0
    - uses: ./.github/actions/setup-ffmpeg
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Create tox environments
      run: |
        tox -p -e py,build --notest
    - name: Run tests
      run: |
        tox -e py
    - name: Build package
      run: |
        tox -e build
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/audio-feeder' || 'https://test.pypi.org/p/audio-feeder' }}
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to TestPyPI
      if: github.event_name == 'push'
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
    - name: Publish to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@v1.14.2
