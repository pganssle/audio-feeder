name: audio_feeder

on: [pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t", "pypy3.11"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
    - uses: ./.github/actions/setup-ffmpeg
    # Our C extension dependencies don't ship wheels for PyPy 8.0's ABI yet,
    # so on PyPy they have to be built from source.
    - name: Install build dependencies
      if: startsWith(matrix.python-version, 'pypy')
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Run tests
      run: tox -e ${{ matrix.python-version }}

  other:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: ["build", "lint", "typing"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Run ${{ matrix.toxenv }}
      run: tox -e ${{ matrix.toxenv }}
