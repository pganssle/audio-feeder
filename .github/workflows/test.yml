name: audio_feeder

on: [pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "pypy3.9"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
    - uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        token: ${{ github.token }}
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Run tests
      run: tox -e ${{ matrix.python-version }}

  other:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: ["build", "lint", "typing"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          tox.ini
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Run ${{ matrix.toxenv }}
      run: tox -e ${{ matrix.toxenv }}
