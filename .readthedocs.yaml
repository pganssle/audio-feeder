# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    # The version number comes from `git describe`, which needs the tags and
    # the full chain of commits back to the latest one, neither of which the
    # shallow clone has. The tree:0 filter fetches only the commits, not their
    # trees or files.
    post_checkout:
      - git fetch --unshallow --tags --filter=tree:0 || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
