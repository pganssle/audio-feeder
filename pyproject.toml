[build-system]
requires = [
  "setuptools >= 40.9.0",
  "wheel",
  "versioningit",
]
build-backend = "setuptools.build_meta"

[project]
name = "audio_feeder"
authors = [{name = "Paul Ganssle"}]
description = """
audio-feeder provides a server that serves your audiobooks and other audio
content as RSS feeds, with rich metadata, and provides a web frontent for navigation."""
license = {text = "Apache 2.0"}
requires-python = ">= 3.9"
dependencies = [
    "Flask>=0.11.1",
    "pyyaml>=6.0",
    "qrcode>=5.3",
    "Pillow>=3.4.2; python_version>='3.10'",
    # 11.0.0 is the last version with wheels for PyPy 3.9
    "Pillow>=3.4.2,<11.1; python_version<'3.10'",
    "requests>=2.12.4",
    "jinja2",
    "click>=6.0",
    "progressbar2",
    "lxml>=2.0,<5.2.0",
    "SQLAlchemy>=2.0",
    "attrs>=22.0",
    "backports.strenum>=1.1.1;python_version<'3.11'",
    "typing_extensions>=4.0.0;python_version<'3.11'",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Framework :: Flask",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dynamic = ["version", "readme"]

[project.scripts]
audio-feeder = "audio_feeder.cli:cli"

[tool.setuptools]
packages = {find = {where = ["src"]}}
package-data = { audio_feeder=["data/**/*"] }
license-files = ["LICENSE"]

[tool.versioningit]
vcs={method = "git", default-tag = "0.0.0"}
write={file="src/audio_feeder/_version.py"}

## Isort
[tool.isort]
atomic=true
force_grid_wrap=0
include_trailing_comma=true
known_first_party = ["audio_feeder"]
known_third_party=[
    "click",
    "flask",
    "hypothesis",
    "jinja2",
    "lxml",
    "ruamel",
    "PIL",
    "progressbar2",
    "pytest",
    "qrcode",
    "requests"
]
multi_line_output=3
use_parentheses=true

## Ruff
# ruff is only used for linting; formatting and import sorting are done by
# black and isort.
[tool.ruff]
target-version = "py39"
extend-exclude = ["src/audio_feeder/data"]

[tool.ruff.lint]
# Preview mode is needed for suppression comments that use rule names, e.g.
# `# ruff: ignore[module-import-not-at-top-of-file]`, which should be used in
# preference to `noqa` comments with rule codes. `explicit-preview-rules`
# keeps preview from enabling unstable rules in the selected groups.
preview = true
explicit-preview-rules = true

# Start from a small set of rules (pyflakes, the pycodestyle errors and the
# equivalents of the pylint checks we were using) rather than enabling
# everything at once. The set is listed explicitly because ruff's default
# selection changes between versions.
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",       # pyflakes
    "PLE",     # pylint errors: invalid __all__, bad format strings, etc.
    "RET506",  # no-else-raise
]

## Coverage
[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true

## Mypy
[tool.mypy]
exclude = ["data/"]
show_error_codes = true

[[tool.mypy.overrides]]
module = "qrcode.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "progressbar.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "werkzeug.*"
ignore_missing_imports = true


## Pytest
[tool.pytest.ini_options]
log_level = "DEBUG"
xfail_strict = true
